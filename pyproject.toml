# Python tooling for e2e/, bench/ and the chart tests only. The server is Go.
[project]
name = "keepsake"
version = "0.0.0"
requires-python = ">=3.14"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruamel-yaml>=0.19.1",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
