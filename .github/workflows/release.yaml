name: release

# Publishes whenever main carries a Chart.yaml appVersion with no tag yet, so merging
# the PR from scripts/release.sh is the whole release. The tag is created last, on
# the commit that was built, so nothing is published that is not in main's history.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Two quick merges MUST NOT race to publish the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Checked before anything is published, because a release is hard to take back.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.image }}
      charts: ${{ steps.image.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          set -euo pipefail
          version=$(grep -E '^appVersion:' charts/keepsake/Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.release == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # Derived, never written down twice: a GHCR namespace follows the repository
      # owner, so moving the repo between a user and an org silently makes a
      # hardcoded namespace one this token cannot push to. Lowercased because GHCR
      # requires it and GitHub owners are not.
      - id: image
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/keepsake" >> "$GITHUB_OUTPUT"
          echo "charts=ghcr.io/$owner/charts" >> "$GITHUB_OUTPUT"
      # The chart's default image must be the one this release publishes, or an
      # install pulls a tag nobody pushed. A repository transfer breaks this loudly
      # rather than at the first `helm install` a stranger runs.
      - if: steps.version.outputs.release == 'true'
        run: |
          set -euo pipefail
          declared=$(grep -E '^  repository:' charts/keepsake/values.yaml | awk '{print $2}')
          if [ "$declared" != "${{ steps.image.outputs.image }}" ]; then
            echo "chart default image is $declared, this release publishes ${{ steps.image.outputs.image }}" >&2
            exit 1
          fi
      - if: steps.version.outputs.release == 'true'
        run: uv sync --locked
      # Holds Chart.yaml's version to its appVersion, compose.yaml's image to both,
      # and the community health files to their locations.
      - if: steps.version.outputs.release == 'true'
        run: uv run pytest tests/test_release_metadata.py -v
      # A release with no changelog entry is a release nobody can read, and an
      # Unreleased section left behind is one that misstates what shipped.
      - if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          grep -q "^## $VERSION\b\|^## \[$VERSION\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## $VERSION' section" >&2
            exit 1
          }
          if grep -q '^## Unreleased' CHANGELOG.md; then
            echo "CHANGELOG.md still has an Unreleased section" >&2
            exit 1
          fi

  image:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # Provenance is an attestation: signed, and stored as one.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.check.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.check.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.check.outputs.version }}
      # arm64 as well as amd64. Graviton and Apple silicon are where a good share
      # of clusters and every local `kind` on a Mac actually run, and a
      # single-arch image leaves them with no image at all. No QEMU: every stage
      # that runs a command runs on the build platform.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # SLSA provenance for the image an operator runs in their cluster. Scorecard
      # scores a bare signature at 8/10 and provenance at 10/10, and the reason is
      # that a signature says who pushed it while provenance says what built it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.check.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: helm package charts/keepsake --version "${{ needs.check.outputs.version }}"
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          helm push "keepsake-${{ needs.check.outputs.version }}.tgz" \
            "oci://${{ needs.check.outputs.charts }}"

  # Last, and only once the artefacts it points at exist. A GitHub Release that
  # names an image nobody pushed is worse than no release.
  release:
    needs: [check, image, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # From the source tree rather than the image: go.sum is the exact resolved
      # dependency set, which is what a consumer wants to diff.
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: keepsake-${{ needs.check.outputs.version }}.cdx.json
          upload-artifact: false
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          IMAGE: ${{ needs.check.outputs.image }}
          CHARTS: ${{ needs.check.outputs.charts }}
        run: |
          set -euo pipefail
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "helm install keepsake oci://$CHARTS/keepsake --version $VERSION"
            echo '```'
            echo
            echo "Image: \`$IMAGE:$VERSION\` (linux/amd64, linux/arm64),"
            echo "with SLSA provenance attached. Verify it with:"
            echo
            echo '```bash'
            echo "gh attestation verify oci://$IMAGE:$VERSION --owner ${{ github.repository_owner }}"
            echo '```'
            echo
            echo "See [CHANGELOG.md](CHANGELOG.md) for what changed."
          } > notes.md
          # Creates the tag on the commit this run built.
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md \
            "keepsake-$VERSION.cdx.json"
