name: CI

# `pull_request` alone for branches: `push` as well ran every branch twice, once
# per event, for the same commit. Pushes to main still run, because that is the
# only place the branch check happens after a merge.
on:
  push:
    branches: [main]
  pull_request:

# A public repo: the default token is read-write unless it is narrowed here, and a
# workflow that only reads its own source needs nothing else.
permissions:
  contents: read

# Supersede an in-flight run when the same branch is pushed again. Never for main —
# cancelling there loses the only run that gates a merged commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to SHAs, not tags: a tag is mutable, and these actions run with the
      # repository checked out. The comment carries the human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # e2e/ too: it is Python that ships in this repo and CI runs it.
      - run: uv run ty check src tests e2e
      - run: uv run lint-imports
      - run: uv run pytest -v
      - run: cd frontend && bun install --frozen-lockfile
      # Regenerates frontend/openapi.json and src/client, then fails the build if a
      # backend response-model change was not accompanied by a regenerated client.
      - run: bash scripts/generate-client.sh
      - run: git diff --exit-code frontend/src/client frontend/openapi.json

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: uv sync --locked
      - run: cd frontend && bun install --frozen-lockfile
      # Version pinned in frontend/package.json; --with-deps installs the matching
      # browser plus the system libraries a bare runner image doesn't have.
      - run: cd frontend && bunx playwright install --with-deps chromium
      # scripts/ui-fixture.sh (run as Playwright's webServer) stands up its own
      # Postgres via testcontainers -- needs the runner's Docker daemon, which
      # ubuntu-latest already has.
      - run: cd frontend && bunx playwright test
      # A failed visual diff is unreadable without the report that shows the actual
      # vs. expected images, and the screenshots are worth having whether or not
      # anything failed -- hence always(), not just failure().
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-screenshots
          path: frontend/screenshots/
          retention-days: 14
          if-no-files-found: ignore
