name: CI

# `pull_request` alone for branches: `push` as well ran every branch twice, once
# per event, for the same commit. Pushes to main still run, because that is the
# only place the branch check happens after a merge.
on:
  push:
    branches: [main]
  pull_request:

# A public repo: the default token is read-write unless it is narrowed here, and a
# workflow that only reads its own source needs nothing else.
permissions:
  contents: read

# Supersede an in-flight run when the same branch is pushed again. Never for main —
# cancelling there loses the only run that gates a merged commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to SHAs, not tags: a tag is mutable, and these actions run with the
      # repository checked out. The comment carries the human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: uv sync --locked
      - run: uv run ruff check e2e tests/test_chart.py tests/test_release_metadata.py
      - run: uv run pytest tests/test_chart.py tests/test_release_metadata.py
      - run: cd frontend && bun install --frozen-lockfile
      # Regenerate from openapi.json, then fail if the committed client is stale.
      # contract_test.go holds the Go server to openapi.json.
      - run: bash scripts/generate-client.sh
      - run: git diff --exit-code frontend/src/client

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /dev/stderr | (! read -r)
      - run: go vet ./...
      # The test packages start containers at once; one flaky registry read failed them all.
      - run: for _ in 1 2 3; do docker pull -q postgres:17 && break; sleep 10; done
      - run: go test -race ./...
