name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  kind:
    runs-on: ubuntu-latest
    # Generous, because it builds an image and stands up a cluster — but bounded:
    # a hung `kubectl wait` would otherwise hold a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # install_only: run.sh creates the cluster itself, through e2e/up.sh.
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true
      - run: uv sync --locked
      - run: bash e2e/run.sh
