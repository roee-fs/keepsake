name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  kind:
    runs-on: ubuntu-latest
    # Generous, because it builds an image and stands up a cluster — but bounded:
    # a hung `kubectl wait` would otherwise hold a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      # install_only: run.sh creates the cluster itself, from e2e/kind.yaml.
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - run: uv sync --locked
      - run: bash e2e/run.sh
