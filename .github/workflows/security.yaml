name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because a dependency becomes vulnerable without anyone touching
    # this repository — a pull-request trigger alone would never notice.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The one write scope here, and only on this job: CodeQL uploads its
      # findings to the Security tab rather than printing them.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go is the server; Python is only e2e/ and the chart tests.
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The default suite skips checks it considers noisy. This is a
          # multi-tenant isolation boundary; we would rather triage the noise.
          queries: security-and-quality
          # Vendored upstream yaml.v3: its findings are upstream's, not ours.
          config: |
            paths-ignore:
              - okf/internal/yaml
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # go.mod and uv.lock pin exact versions, so this reads the resolved trees
      # rather than ranges. Clean as of this commit, so failing the job on a
      # finding costs nothing today and is the point of having it.
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=go.mod
            --lockfile=uv.lock
