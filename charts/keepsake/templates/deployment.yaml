{{- $port := 8000 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      # Nothing here reads a Service link variable. See cli.EnvPort in internal/cli/cli.go.
      enableServiceLinks: false
      # Spread across nodes where there is more than one: two replicas on one node
      # share its fate, which is most of what the second replica was bought for.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if eq .Values.auth.mode "jwt" }}
      volumes:
        - name: jwt
          secret:
            secretName: {{ .Values.auth.jwt.existingSecret | quote }}
            items:
              - key: secrets
                path: secrets
      {{- end }}
      containers:
        - name: keepsake
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["keepsake", "serve"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            # The app DSN. It MUST NOT be the owner DSN the migration Job runs with:
            # the server verifies its own privileges and refuses to serve otherwise.
            - name: KEEPSAKE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-dsn
                  key: app-dsn
            - name: KEEPSAKE_AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            {{- if eq .Values.auth.mode "jwt" }}
            - name: KEEPSAKE_JWT_ISSUER
              value: {{ .Values.auth.jwt.issuer | quote }}
            - name: KEEPSAKE_JWT_AUDIENCE
              value: {{ .Values.auth.jwt.audience | quote }}
            - name: KEEPSAKE_JWT_SECRET_FILE
              value: /etc/keepsake/jwt/secrets
            {{- else }}
            - name: KEEPSAKE_TENANT_ID
              value: {{ .Values.auth.fixedTenantId | quote }}
            {{- end }}
            - name: KEEPSAKE_SCHEMA
              value: {{ .Values.postgres.schema | quote }}
            - name: KEEPSAKE_POOL_SIZE
              value: {{ .Values.postgres.poolSize | quote }}
            # Set, not left to the CLI's default: the port below and the readiness
            # probe would otherwise depend on that default never moving.
            - name: KEEPSAKE_PORT
              value: {{ $port | quote }}
            # ui_enabled() compares against the literal string "true"; an unquoted
            # boolean renders bare and Kubernetes rejects it as an env value.
            - name: KEEPSAKE_UI
              value: {{ .Values.ui.enabled | quote }}
            - name: KEEPSAKE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret | default (printf "%s-admin" .Release.Name) }}
                  key: password
          {{- if eq .Values.auth.mode "jwt" }}
          volumeMounts:
            - name: jwt
              mountPath: /etc/keepsake/jwt
              readOnly: true
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $port }}
          # /readyz answers only once the startup check has passed and the pool can
          # still hand out a connection. A bound port is not enough: after a database
          # failover a replica keeps its port, and its place in the Service, while its
          # pool is rebuilding — so every request routed to it waits and then fails.
          # No liveness probe: a pod refusing to start is already crash-looping, and
          # restarting it would only bury the reason.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            # Longer than the server's own wait for a connection, so the probe reports
            # a 503 it decided on rather than a timeout the kubelet decided for it.
            timeoutSeconds: 3
            # Two failures, not one: a single slow probe during a checkpoint must not
            # empty the Service.
            failureThreshold: 2
