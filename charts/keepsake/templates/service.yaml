apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
    {{- if .Values.ui.enabled }}
    - name: console
      port: {{ .Values.service.consolePort }}
      targetPort: console
      {{- with .Values.service.consoleNodePort }}
      nodePort: {{ . }}
      {{- end }}
    {{- end }}
