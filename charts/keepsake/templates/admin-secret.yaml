{{- /* Nothing to generate when the operator brought their own. Unguarded, this
       would regenerate on every GitOps sync — `lookup` is blind under
       `helm template` — and leave the release permanently out of sync against a
       Secret nothing reads. `resource-policy: keep` would then outlive uninstall. */}}
{{- if not .Values.admin.existingSecret }}
{{- $name := printf "%s-admin" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app: {{ .Release.Name }}
  annotations:
    # Survives `helm uninstall`: in `postgres.mode: existing` the database outlives
    # the release, and losing this locks the operator out of their own data.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
