{{- $cluster := .Values.postgres.cluster -}}
{{- $owner := .Values.postgres.ownerDsn | default .Values.postgres.dsn -}}
{{- $app := .Values.postgres.dsn -}}
{{- if eq .Values.postgres.mode "managed" -}}
{{- $host := printf "%s-db-rw" .Release.Name -}}
{{- $owner = printf "postgres://okf_owner:%s@%s:5432/%s" $cluster.ownerPassword $host $cluster.database -}}
{{- $app = printf "postgres://okf_app:%s@%s:5432/%s" $cluster.appPassword $host $cluster.database -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-dsn
  labels:
    app: {{ .Release.Name }}
  annotations:
    # A hook, because the migration hook reads it before normal resources install.
    # Nothing deletes it afterwards: the Deployment reads it for the release's life,
    # and uninstall leaves it behind.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  owner-dsn: {{ $owner | quote }}
  app-dsn: {{ $app | quote }}
{{- if eq .Values.postgres.mode "managed" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-owner
  labels:
    app: {{ .Release.Name }}-db
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
# The credentials CloudNativePG bootstraps the owning role with.
type: kubernetes.io/basic-auth
stringData:
  username: okf_owner
  password: {{ $cluster.ownerPassword | quote }}
{{- end }}
