image:
  repository: ghcr.io/frontier-security/keepsake
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
replicaCount: 2

# A request is what the scheduler honours; without one the pod is BestEffort and is
# evicted first under node pressure. The limit is memory only on purpose — a CPU
# limit throttles rather than kills, which turns a busy pod into a slow one and
# makes the readiness probe flap.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# The server writes nothing to its filesystem and needs no privileges. No runAsUser:
# the image already declares one, and pinning a second here is a value that drifts
# from the Dockerfile silently.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8000
  nodePort: null # only honoured when type is NodePort or LoadBalancer

auth:
  mode: none # the only mode implemented; proxy and token are not built yet
  fixedTenantId: "00000000-0000-0000-0000-000000000001"

postgres:
  mode: managed # managed | existing
  schema: okf

  # Connections per replica, and so the concurrency one replica serves: the tool
  # bodies block on the driver, and the worker threads running them are bounded by
  # this same number. The database sees poolSize × replicaCount backends.
  poolSize: 10

  # existing mode. `dsn` is the server's, and it MUST NOT own the schema or the
  # tables: the server verifies that at startup and refuses to serve otherwise.
  dsn: "" # required when mode = existing
  # The migration's DSN, which must own the schema. Required, because running the
  # migration as `dsn` creates the schema and tables OWNED BY THAT ROLE, which the
  # server then refuses to connect as, for good: setting ownerDsn afterwards does
  # not repair it, because the owner role holds nothing on a schema it does not own.
  # Recovering means ALTER ... OWNER surgery or recreating the database.
  ownerDsn: "" # required when mode = existing

  # managed mode. CloudNativePG bootstraps the database owned by okf_owner and
  # creates okf_app, the unprivileged role the server connects as.
  cluster:
    instances: 1
    storage: 1Gi
    database: keepsake
    # Development defaults. Both end up in the release, and appPassword also lands
    # in the Cluster spec. Override them for any install that matters, and keep
    # them alphanumeric: they are interpolated into a URL, which does not escape.
    ownerPassword: owner
    appPassword: app
